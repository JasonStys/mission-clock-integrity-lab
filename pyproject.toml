# Jason Stys: stdlib runtime and strict independent numerical verification.
[project]
name = "mission-clock-integrity-lab"
version = "1.1.0"
description = "Offline synthetic clock holdover and timestamp ordering evidence by Jason Stys"
requires-python = ">=3.12,<3.15"
dependencies = []
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
[tool.coverage.run]
branch = true
source = ["clocklab"]
[tool.coverage.report]
fail_under = 90
show_missing = true
[tool.mypy]
strict = true
python_version = "3.12"
files = ["clocklab"]

[tool.portable]
package = "clocklab"
executable = "MissionClockIntegrityLab"
title = "Mission Clock Integrity Lab"
workflows = ["validate.yml", "codeql.yml"]
